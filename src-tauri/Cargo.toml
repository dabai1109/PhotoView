[package]
name = "photoview"
version = "1.4.1"
description = "PhotoView - 摄影师超高速选片工作台"
authors = ["PhotoView"]
edition = "2021"

[lib]
name = "photoview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 没有用到任何 Tauri 插件：文件对话框走 rfd，打开文件走 open，
# 图片读取全在 Rust 侧完成，前端不需要 fs / shell 权限。
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
walkdir = "2"
base64 = "0.22"
dirs = "5"
open = "5"
pathdiff = "0.2"
alphanumeric-sort = "1.5"
rfd = "0.15"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# 装包体积是这个项目的核心指标之一
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
