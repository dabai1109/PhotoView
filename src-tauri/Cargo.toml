[package]
name = "photoview"
version = "1.0.0"
description = "PhotoView - 摄影师超高速选片工作台"
authors = ["PhotoView"]
edition = "2021"

[lib]
name = "photoview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
walkdir = "2"
base64 = "0.22"
kamadak-exif = "0.5"
dirs = "5"
open = "5"
pathdiff = "0.2"
alphanumeric-sort = "1.5"
rfd = "0.15"
