name: Build and Release PhotoView

on:
  push:
    tags:
      - '*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:js

      # 不加 --lib：这样 tests/fixtures.rs 的端到端用例（跑真实 test-photos/）也会执行。
      # 会动系统回收站的那个用例已标 #[ignore]，不会在 CI 上跑。
      - name: Run Rust tests
        working-directory: ./src-tauri
        run: cargo test

      # 打包只在 tag（发版）和手动触发（想验证打包链路）时做。
      # 普通 push 分支只跑上面的测试就够了 —— 否则每个提交都要在两个平台各跑一遍
      # release 模式的 Rust 构建（lto + codegen-units=1），纯属烧 CI 时长。
      #
      # tagName 为空时 tauri-action 只构建、不发布，所以手动触发不会误发 release；
      # 也正因如此，push 到 main 不会创建一个 tag 叫 "main" 的正式 release。
      - name: Build and Release Tauri App
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('PhotoView {0}', github.ref_name) || '' }}
          releaseBody: 'PhotoView 极致轻量选片工作台 (Tauri 2.0 驱动，安装包仅 2~10MB)'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
